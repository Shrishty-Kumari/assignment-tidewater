apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: settle
resources:
  - ../../base
  - external-secrets.yaml
patches:
  # REDIS_URL (TLS + AUTH) comes from Secrets Manager instead of the ConfigMap
  - target:
      kind: ConfigMap
      name: settle-config
    patch: |-
      - op: remove
        path: /data/REDIS_URL
      - op: replace
        path: /data/BANK_API_URL
        value: https://payouts.partner-bank.example
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: settle-redis
              key: REDIS_URL
  - target:
      kind: Ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: settle.staging.paylane.internal
  # RDS / ElastiCache live in the database subnets (terraform output
  # database_subnet_cidrs); pods reach them by CIDR, not by pod label
  - path: networkpolicy-aws.yaml
