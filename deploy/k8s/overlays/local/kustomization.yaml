apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: settle
resources:
  - ../../base
patches:
  - target:
      kind: ConfigMap
      name: settle-config
    patch: |-
      - op: add
        path: /data/REPORT_SIMULATED_COST_SECONDS
        value: "6"
  # laptop-sized requests; limits unchanged
  - target:
      kind: Deployment
      name: settle-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 160Mi
