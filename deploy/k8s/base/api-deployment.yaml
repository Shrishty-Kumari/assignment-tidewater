apiVersion: apps/v1
kind: Deployment
metadata:
  name: settle-api
  namespace: settle
  labels:
    app.kubernetes.io/name: settle-api
    app.kubernetes.io/part-of: settle
spec:
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 180
  minReadySeconds: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: settle-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: settle-api
        app.kubernetes.io/part-of: settle
    spec:
      serviceAccountName: settle-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: settle-api
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: settle-api
      containers:
        - name: api
          image: settle-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: settle-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: settle-db
                  key: DATABASE_URL
            - name: DB_POOL_SIZE
              valueFrom:
                configMapKeyRef:
                  name: settle-config
                  key: API_DB_POOL_SIZE
            - name: DB_MAX_OVERFLOW
              valueFrom:
                configMapKeyRef:
                  name: settle-config
                  key: API_DB_MAX_OVERFLOW
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /var/run/prometheus
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: prometheus-multiproc
              mountPath: /var/run/prometheus
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: prometheus-multiproc
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
