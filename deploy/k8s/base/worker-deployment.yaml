apiVersion: apps/v1
kind: Deployment
metadata:
  name: settle-worker
  namespace: settle
  labels:
    app.kubernetes.io/name: settle-worker
    app.kubernetes.io/part-of: settle
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 180
  selector:
    matchLabels:
      app.kubernetes.io/name: settle-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: settle-worker
        app.kubernetes.io/part-of: settle
    spec:
      serviceAccountName: settle-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: settle-worker
      containers:
        - name: worker
          image: settle-api
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "settle.worker"]
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: settle-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: settle-db
                  key: DATABASE_URL
            - name: DB_POOL_SIZE
              valueFrom:
                configMapKeyRef:
                  name: settle-config
                  key: WORKER_DB_POOL_SIZE
            - name: DB_MAX_OVERFLOW
              valueFrom:
                configMapKeyRef:
                  name: settle-config
                  key: WORKER_DB_MAX_OVERFLOW
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          livenessProbe:
            exec:
              command: ["python", "-m", "settle.worker", "--check-alive"]
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
