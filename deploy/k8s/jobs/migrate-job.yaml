apiVersion: batch/v1
kind: Job
metadata:
  name: settle-migrate
  namespace: settle
  labels:
    app.kubernetes.io/name: settle-migrate
    app.kubernetes.io/part-of: settle
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: settle-migrate
        app.kubernetes.io/part-of: settle
    spec:
      restartPolicy: Never
      serviceAccountName: settle-migrate
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: settle-api
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "settle.migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: settle-db-migrate
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
