    : \"sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\\\"settle\\\"}[10m]))\",\n     \"legendFormat\": \"{{pod}}\",\n     \"refId\": \"A\"\n    }\n   ]\n  },\n  {\n   \"type\"\
