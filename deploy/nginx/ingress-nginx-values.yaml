controller:
  replicaCount: 1
  ingressClassResource:
    name: nginx
    default: true
  service:
    type: LoadBalancer
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
  podAnnotations:
    prometheus.io/scrape: "true"
  config:
    server-tokens: "false"
    proxy-connect-timeout: "3"
    proxy-read-timeout: "10"
    proxy-send-timeout: "10"
    proxy-next-upstream: "error"
    proxy-next-upstream-tries: "2"
    proxy-body-size: "1m"
    upstream-keepalive-connections: "64"
    upstream-keepalive-timeout: "60"
    allow-snippet-annotations: "false"
    enable-underscores-in-headers: "false"
    error-log-level: "warn"
    generate-request-id: "true"
    log-format-escape-json: "true"
    log-format-upstream: >-
      {"ts":"$time_iso8601","request_id":"$req_id","remote_addr":"$remote_addr",
      "method":"$request_method","uri":"$uri","status":$status,
      "bytes":$body_bytes_sent,"request_time":$request_time,
      "upstream_addr":"$upstream_addr","upstream_status":"$upstream_status",
      "upstream_response_time":"$upstream_response_time",
      "ingress":"$ingress_name","service":"$service_name"}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
