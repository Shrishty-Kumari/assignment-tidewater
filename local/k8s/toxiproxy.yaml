apiVersion: v1
kind: ConfigMap
metadata:
  name: toxiproxy
  namespace: settle
data:
  toxiproxy.json: |
    [{"name": "postgres", "listen": "0.0.0.0:5432", "upstream": "postgres-db.settle.svc:5432", "enabled": true}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toxiproxy
  namespace: settle
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: toxiproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: toxiproxy
        settle.paylane.io/role: database
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: toxiproxy
          image: ghcr.io/shopify/toxiproxy:2.12.0
          args: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
          ports:
            - name: postgres
              containerPort: 5432
            - name: api
              containerPort: 8474
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: toxiproxy
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: settle
spec:
  selector:
    app.kubernetes.io/name: toxiproxy
  ports:
    - name: postgres
      port: 5432
