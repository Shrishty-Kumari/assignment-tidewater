apiVersion: v1
data:
  API_DB_MAX_OVERFLOW: "0"
  API_DB_POOL_SIZE: "2"
  BANK_API_URL: http://bankmock.settle.svc:8080
  BANK_TIMEOUT_SECONDS: "10"
  DB_LOCK_TIMEOUT_MS: "2000"
  DB_POOL_TIMEOUT: "2"
  DB_STATEMENT_TIMEOUT_MS: "5000"
  GUNICORN_WORKERS: "4"
  LOG_LEVEL: INFO
  REDIS_URL: redis://redis.settle.svc:6379/0
  REPORT_SIMULATED_COST_SECONDS: "6"
  REPORT_STATEMENT_TIMEOUT_MS: "15000"
  WORKER_CONCURRENCY: "4"
  WORKER_DB_MAX_OVERFLOW: "0"
  WORKER_DB_POOL_SIZE: "5"
  WORKER_LEASE_SECONDS: "30"
  WORKER_MAX_ATTEMPTS: "8"
  WORKER_SHUTDOWN_TIMEOUT: "45"
