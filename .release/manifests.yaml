---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    settle.paylane.io/version: 1.9.0-test3
  labels:
    app.kubernetes.io/name: settle-api
    app.kubernetes.io/part-of: settle
  name: settle-api
  namespace: settle
spec:
  minReadySeconds: 10
  progressDeadlineSeconds: 180
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: settle-api
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        settle.paylane.io/version: 1.9.0-test3
      labels:
        app.kubernetes.io/name: settle-api
        app.kubernetes.io/part-of: settle
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: DATABASE_URL
              name: settle-db
        - name: DB_POOL_SIZE
          valueFrom:
            configMapKeyRef:
              key: API_DB_POOL_SIZE
              name: settle-config
        - name: DB_MAX_OVERFLOW
          valueFrom:
            configMapKeyRef:
              key: API_DB_MAX_OVERFLOW
              name: settle-config
        - name: PROMETHEUS_MULTIPROC_DIR
          value: /var/run/prometheus
        - name: WORKER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: settle-config
        image: settle-registry:5000/settle-api@sha256:289d47bbd20b8a2fd8695d5da1ccb4192f22a61ca1b5a9374a5763595afe480d
        imagePullPolicy: IfNotPresent
        lifecycle:
          preStop:
            exec:
              command:
              - sleep
              - "10"
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /livez
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
        name: api
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 160Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /livez
            port: http
          periodSeconds: 2
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        - mountPath: /var/run/prometheus
          name: prometheus-multiproc
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: settle-api
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: settle-api
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: settle-api
        maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - emptyDir:
          sizeLimit: 64Mi
        name: tmp
      - emptyDir:
          medium: Memory
          sizeLimit: 64Mi
        name: prometheus-multiproc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    settle.paylane.io/version: 1.9.0-test3
  labels:
    app.kubernetes.io/name: settle-worker
    app.kubernetes.io/part-of: settle
  name: settle-worker
  namespace: settle
spec:
  progressDeadlineSeconds: 180
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: settle-worker
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        settle.paylane.io/version: 1.9.0-test3
      labels:
        app.kubernetes.io/name: settle-worker
        app.kubernetes.io/part-of: settle
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - python
        - -m
        - settle.worker
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: DATABASE_URL
              name: settle-db
        - name: DB_POOL_SIZE
          valueFrom:
            configMapKeyRef:
              key: WORKER_DB_POOL_SIZE
              name: settle-config
        - name: DB_MAX_OVERFLOW
          valueFrom:
            configMapKeyRef:
              key: WORKER_DB_MAX_OVERFLOW
              name: settle-config
        - name: WORKER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: settle-config
        image: settle-registry:5000/settle-api@sha256:289d47bbd20b8a2fd8695d5da1ccb4192f22a61ca1b5a9374a5763595afe480d
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - python
            - -m
            - settle.worker
            - --check-alive
          failureThreshold: 3
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 5
        name: worker
        ports:
        - containerPort: 9100
          name: metrics
        resources:
          limits:
            cpu: 500m
            memory: 384Mi
          requests:
            cpu: 100m
            memory: 192Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: settle-worker
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: settle-worker
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - emptyDir:
          sizeLimit: 64Mi
        name: tmp
---
